name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build core
        run: swift build
      # The dependency-free runner is used instead of `swift test` because
      # XCTest and Swift Testing both require a full Xcode toolchain.
      - name: Verify mapping logic
        run: swift run corgify-verify
