name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build core
        run: swift build
      # The dependency-free runner is used instead of `swift test` because
      # XCTest and Swift Testing both require a full Xcode toolchain.
      - name: Verify mapping logic
        run: swift run corgify-verify
      # Runs the real Vision pipeline so a regression in the landmark math or
      # a range that starts clipping shows up in CI, not on a device.
      - name: Validate against real photos
        run: |
          ./scripts/fetch-validation-photos.sh
          swift run corgify-analyze .validation/*.jpg
